# Workers Builds config (Deploy command: npx wrangler deploy).
# The site is static (Astro → dist, served as Workers assets); the admin CMS
# in functions/ is compiled by `npm run build` into .worker/ and runs as the
# Worker script. /admin/* goes to the Worker first, everything else to assets.
name = "blog-shubinvc"
compatibility_date = "2025-09-01"
compatibility_flags = ["nodejs_compat"]
main = ".worker/index.js"

[assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "404-page"
run_worker_first = ["/admin", "/admin/*"]

# ── shubin.vc admin ────────────────────────────────────────────────────────
# 1) Create the database:   wrangler d1 create shubinvc-admin
#    then put the printed database_id below and run admin/schema.sql
# 2) Create KV storage:     wrangler kv namespace create ADMIN_KV
#    then put the printed id below
# 3) Secrets (wrangler secret put <NAME>, or dashboard → Variables and Secrets):
#    GITHUB_TOKEN  — fine-grained PAT, Contents: read/write on the repo
#    TOKEN_KEY     — 64 random hex chars (AES-256 key for stored API tokens)
#    GOOGLE_SA_JSON — optional, service-account JSON for the Indexing API

[[d1_databases]]
binding = "DB"
database_name = "shubinvc-admin"
database_id = "e424021a-f4aa-4256-a525-837f2ffdbf29"

[[kv_namespaces]]
binding = "ADMIN_KV"
id = "f9e92b9ae87f402e9998f8f38bdf7f08"

[vars]
GITHUB_OWNER = "raceoffer"
GITHUB_REPO = "blog_shubinvc"
GITHUB_BRANCH = "main"
SITE_URL = "https://shubin.vc"
RP_ID = "shubin.vc"
RP_NAME = "SHUBIN.vc"
